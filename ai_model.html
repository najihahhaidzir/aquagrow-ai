<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaGrow AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
        }

        #status {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div id="status">Loading AI model...</div>

<script>

const MODEL_URL =
    "https://teachablemachine.withgoogle.com/models/ehIWPbKdh/";

let model = null;


// Load Teachable Machine model
async function loadModel() {

    try {

        model = await tmImage.load(
            MODEL_URL + "model.json",
            MODEL_URL + "metadata.json"
        );

        document.getElementById("status").innerHTML =
            "AI Model Ready";

        if (window.AppInventor) {
            window.AppInventor.setWebViewString(
                "MODEL_READY"
            );
        }

    } catch (error) {

        document.getElementById("status").innerHTML =
            "Model Error";

        if (window.AppInventor) {
            window.AppInventor.setWebViewString(
                "MODEL_ERROR|" + error.message
            );
        }
    }
}


// Predict image
async function predictImage(imageData) {

    if (!model) {

        if (window.AppInventor) {
            window.AppInventor.setWebViewString(
                "MODEL_NOT_READY"
            );
        }

        return;
    }

    const img = new Image();

    img.onload = async function() {

        try {

            const prediction =
                await model.predict(img);

            const healthyProbability =
                prediction[0].probability;

            const unhealthyProbability =
                prediction[1].probability;

            let condition;
            let confidence;

            if (healthyProbability >= unhealthyProbability) {

                condition = "Healthy";
                confidence = healthyProbability;

            } else {

                condition = "Unhealthy";
                confidence = unhealthyProbability;
            }

            const confidencePercent =
                Math.round(confidence * 100);

            let recommendation;

            if (condition === "Healthy") {

                recommendation =
                    "The plant appears healthy. Continue regular watering and monitoring.";

            } else {

                recommendation =
                    "The plant may be unhealthy. Check the leaves, moisture level and plant condition.";
            }

            const result =
                condition +
                "|" +
                confidencePercent +
                "|" +
                recommendation;

            if (window.AppInventor) {

                window.AppInventor.setWebViewString(
                    result
                );
            }

        } catch (error) {

            if (window.AppInventor) {

                window.AppInventor.setWebViewString(
                    "PREDICTION_ERROR|" +
                    error.message
                );
            }
        }
    };

    img.src = imageData;
}


loadModel();

</script>

</body>
</html>
