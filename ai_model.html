<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaGrow Image Test</title>

</head>

<body>

<div id="status">
    Waiting for image...
</div>

<script>

function testImage(imagePath) {

    const img = new Image();

    img.onload = function() {

        document.getElementById("status").innerHTML =
            "IMAGE CAN BE READ";

        if (window.AppInventor) {

            window.AppInventor.setWebViewString(
                "IMAGE_CAN_BE_READ"
            );

        }

    };


    img.onerror = function() {

        document.getElementById("status").innerHTML =
            "IMAGE CANNOT BE READ";

        if (window.AppInventor) {

            window.AppInventor.setWebViewString(
                "IMAGE_CANNOT_BE_READ"
            );

        }

    };


    img.src = imagePath;

}

</script>

</body>

</html>
